<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'IBM Plex Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aab6c2"/>
      <stop offset="0.42" stop-color="#e7edf2"/>
      <stop offset="0.62" stop-color="#c3ccd6"/>
      <stop offset="1" stop-color="#8a97a5"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7dee6"/>
      <stop offset="1" stop-color="#aab6c2"/>
    </linearGradient>
    <clipPath id="stageClip"><rect x="32" y="100" width="680" height="468" rx="12"/></clipPath>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1200" height="600" rx="16" fill="#eceef1"/>

  <!-- header -->
  <rect x="32" y="28" width="44" height="44" rx="9" fill="#0d7c86"/>
  <text x="54" y="59" text-anchor="middle" font-size="26" font-weight="600" fill="#ffffff" font-family="'IBM Plex Mono', ui-monospace, monospace">⌀</text>
  <text x="90" y="52" font-size="27" font-weight="700" fill="#161b24">Shaft Gauge</text>
  <text x="90" y="74" font-size="14.5" fill="#5a6474">Read diameter and length from an STL model, in millimeters</text>
  <g>
    <rect x="946" y="36" width="222" height="30" rx="15" fill="#ffffff" stroke="#dbdfe6"/>
    <circle cx="965" cy="51" r="4" fill="#1f8a4c"/>
    <text x="977" y="55.5" font-size="12.5" fill="#5a6474">Processed entirely in the browser</text>
  </g>

  <!-- ===== STAGE ===== -->
  <rect x="32" y="100" width="680" height="468" rx="12" fill="#dfe4ea" stroke="#c4cad4"/>
  <g clip-path="url(#stageClip)" stroke="#d3d9e1" stroke-width="1">
    <path d="M112 100V568 M192 100V568 M272 100V568 M352 100V568 M432 100V568 M512 100V568 M592 100V568 M672 100V568
             M32 160H712 M32 220H712 M32 280H712 M32 340H712 M32 400H712 M32 460H712 M32 520H712"/>
  </g>

  <!-- bounding box (dashed amber) -->
  <rect x="150" y="238" width="430" height="180" fill="none" stroke="#c2610b" stroke-width="2" stroke-dasharray="6 5" opacity="0.75"/>

  <!-- shaft cylinder (axis horizontal) -->
  <g clip-path="url(#stageClip)">
    <ellipse cx="188" cy="328" rx="26" ry="82" fill="#9aa6b3"/>
    <rect x="188" y="246" width="356" height="164" fill="url(#shaft)"/>
    <ellipse cx="544" cy="328" rx="26" ry="82" fill="url(#cap)" stroke="#8a97a5" stroke-width="1.5"/>
  </g>

  <!-- 3-point circle feature on the front face -->
  <ellipse cx="544" cy="328" rx="26" ry="82" fill="none" stroke="#c2610b" stroke-width="2.5"/>
  <circle cx="544" cy="246" r="5" fill="#c2610b"/>
  <circle cx="522" cy="386" r="5" fill="#c2610b"/>
  <circle cx="566" cy="386" r="5" fill="#c2610b"/>
  <g>
    <rect x="566" y="300" width="118" height="26" rx="6" fill="#c2610b"/>
    <text x="576" y="318" font-size="14" font-weight="600" fill="#ffffff" font-family="'IBM Plex Mono', ui-monospace, monospace">⌀ 20.00 mm</text>
  </g>

  <!-- point-to-point length measurement (teal) -->
  <line x1="188" y1="470" x2="544" y2="470" stroke="#0d7c86" stroke-width="2.5"/>
  <line x1="188" y1="455" x2="188" y2="485" stroke="#0d7c86" stroke-width="2"/>
  <line x1="544" y1="455" x2="544" y2="485" stroke="#0d7c86" stroke-width="2"/>
  <circle cx="188" cy="470" r="6" fill="#0d7c86" stroke="#fff" stroke-width="2"/>
  <circle cx="544" cy="470" r="6" fill="#0d7c86" stroke="#fff" stroke-width="2"/>
  <g>
    <rect x="316" y="457" width="100" height="26" rx="6" fill="#0d7c86"/>
    <text x="366" y="475" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" font-family="'IBM Plex Mono', ui-monospace, monospace">50.00 mm</text>
  </g>

  <!-- axis triad -->
  <g stroke-width="2.5" font-size="12" font-family="'IBM Plex Mono', ui-monospace, monospace">
    <line x1="70" y1="536" x2="102" y2="536" stroke="#d1495b"/><text x="108" y="540" fill="#d1495b">X</text>
    <line x1="70" y1="536" x2="70" y2="504" stroke="#2a9d5c"/><text x="63" y="500" fill="#2a9d5c">Y</text>
    <line x1="70" y1="536" x2="50" y2="552" stroke="#3d6fd1"/><text x="38" y="560" fill="#3d6fd1">Z</text>
  </g>

  <!-- ===== READOUT PANEL ===== -->
  <rect x="728" y="100" width="440" height="468" rx="12" fill="#ffffff" stroke="#dbdfe6"/>
  <text x="752" y="134" font-size="11.5" letter-spacing="2" fill="#8b94a3" font-weight="600">MEASUREMENT RESULTS</text>

  <!-- metric tiles -->
  <rect x="752" y="150" width="192" height="92" rx="10" fill="#0d7c8618" stroke="#0d7c8660"/>
  <text x="768" y="178" font-size="13" fill="#5a6474">Length (axis)</text>
  <text x="768" y="216" font-size="30" font-weight="600" fill="#0a5b63" font-family="'IBM Plex Mono', ui-monospace, monospace">50.00<tspan font-size="14" fill="#5a6474"> mm</tspan></text>

  <rect x="952" y="150" width="192" height="92" rx="10" fill="#c2610b1f" stroke="#c2610b70"/>
  <text x="968" y="178" font-size="13" fill="#5a6474">Diameter ⌀</text>
  <text x="968" y="216" font-size="30" font-weight="600" fill="#c2610b" font-family="'IBM Plex Mono', ui-monospace, monospace">20.00<tspan font-size="14" fill="#5a6474"> mm</tspan></text>

  <!-- axis selector -->
  <text x="752" y="278" font-size="13" fill="#5a6474">Shaft axis:</text>
  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="600">
    <rect x="828" y="264" width="60" height="26" rx="7" fill="#0d7c86"/><text x="858" y="281" text-anchor="middle" fill="#fff">Auto</text>
    <rect x="890" y="264" width="40" height="26" fill="#ffffff" stroke="#c4cad4"/><text x="910" y="281" text-anchor="middle" fill="#5a6474">X</text>
    <rect x="930" y="264" width="40" height="26" fill="#ffffff" stroke="#c4cad4"/><text x="950" y="281" text-anchor="middle" fill="#5a6474">Y</text>
    <rect x="970" y="264" width="40" height="26" rx="0" fill="#ffffff" stroke="#c4cad4"/><text x="990" y="281" text-anchor="middle" fill="#5a6474">Z</text>
  </g>

  <!-- dims table -->
  <g font-size="12.5">
    <text x="752" y="326" fill="#8b94a3" font-size="11" letter-spacing="0.5">AXIS</text>
    <text x="1032" y="326" fill="#8b94a3" font-size="11" text-anchor="end">SIZE</text>
    <text x="1092" y="326" fill="#8b94a3" font-size="11" text-anchor="end">MIN</text>
    <text x="1144" y="326" fill="#8b94a3" font-size="11" text-anchor="end">MAX</text>
    <line x1="752" y1="334" x2="1144" y2="334" stroke="#dbdfe6"/>

    <rect x="752" y="346" width="10" height="10" rx="2" fill="#d1495b"/><text x="770" y="356" fill="#161b24" font-weight="600">X</text>
    <text x="1032" y="356" text-anchor="end" fill="#161b24" font-family="'IBM Plex Mono', ui-monospace, monospace">20.00</text>
    <text x="1092" y="356" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">-10.00</text>
    <text x="1144" y="356" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">10.00</text>
    <line x1="752" y1="366" x2="1144" y2="366" stroke="#eef0f3"/>

    <rect x="752" y="378" width="10" height="10" rx="2" fill="#2a9d5c"/><text x="770" y="388" fill="#161b24" font-weight="600">Y</text>
    <text x="1032" y="388" text-anchor="end" fill="#161b24" font-family="'IBM Plex Mono', ui-monospace, monospace">20.00</text>
    <text x="1092" y="388" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">-10.00</text>
    <text x="1144" y="388" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">10.00</text>
    <line x1="752" y1="398" x2="1144" y2="398" stroke="#eef0f3"/>

    <rect x="752" y="410" width="10" height="10" rx="2" fill="#3d6fd1"/><text x="770" y="420" fill="#161b24" font-weight="600">Z</text>
    <text x="808" y="420" fill="#c2610b" font-size="10.5" font-weight="600">↑ axis</text>
    <text x="1032" y="420" text-anchor="end" fill="#161b24" font-family="'IBM Plex Mono', ui-monospace, monospace">50.00</text>
    <text x="1092" y="420" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">5.00</text>
    <text x="1144" y="420" text-anchor="end" fill="#5a6474" font-family="'IBM Plex Mono', ui-monospace, monospace">55.00</text>
  </g>

  <!-- meta -->
  <line x1="752" y1="452" x2="1144" y2="452" stroke="#dbdfe6"/>
  <text x="752" y="480" font-size="12.5" fill="#5a6474">Volume <tspan fill="#161b24" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, monospace">15.70 cm³</tspan></text>
  <text x="952" y="480" font-size="12.5" fill="#5a6474">Triangles <tspan fill="#161b24" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, monospace">480</tspan></text>
  <text x="752" y="506" font-size="12.5" fill="#5a6474">Bounding diagonal <tspan fill="#161b24" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, monospace">57.45 mm</tspan></text>

  <!-- circle result chip -->
  <rect x="752" y="524" width="392" height="28" rx="8" fill="#c2610b14"/>
  <text x="766" y="543" font-size="12.5" fill="#5a6474">3-point circle ⌀ <tspan fill="#c2610b" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, monospace">20.00 mm</tspan> · radius <tspan fill="#161b24" font-weight="600" font-family="'IBM Plex Mono', ui-monospace, monospace">10.00 mm</tspan></text>
</svg>
